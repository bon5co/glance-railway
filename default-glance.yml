# Default Glance dashboard written by the Railway wrapper on first boot. Edit this file on the volume, or set a GLANCE_CONFIG
# variable with a full config to replace it at every boot.
server:
  port: ${PORT}
  proxied: true

auth:
  secret-key: ${GLANCE_SECRET_KEY}
  users:
    admin:
      password: ${ADMIN_PASSWORD}

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

          - type: server-stats
            servers:
              - type: local
                name: Railway container

          - type: releases
            cache: 1d
            repositories:
              - glanceapp/glance
              - railwayapp/cli

      - size: full
        widgets:
          - type: group
            widgets:
              - type: hacker-news
              - type: lobsters

          - type: rss
            title: Self-hosting
            limit: 10
            collapse-after: 5
            cache: 12h
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
              - url: https://blog.railway.com/rss.xml
                title: Railway blog

      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: Railway
                links:
                  - title: Dashboard
                    url: https://railway.com/dashboard
                  - title: Docs
                    url: https://docs.railway.com
              - title: Glance
                links:
                  - title: Configuration reference
                    url: https://github.com/glanceapp/glance/blob/main/docs/configuration.md
